<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind Meld</title>
<style>
:root{--bg:#0e1020;--card:#171a31;--card2:#1f2342;--ink:#f4f5ff;--mute:#9aa0c8;--accent:#7c5cff;--accent2:#22d3ee;--good:#34d399;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(900px 500px at 15% -10%,#2a2170 0%,transparent 60%),radial-gradient(800px 500px at 100% 110%,#0b4a63 0%,transparent 55%),var(--bg);background-attachment:fixed}
#app{max-width:560px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
h1{font-size:44px;margin:8px 0 0;letter-spacing:-1px;line-height:1}
h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--mute);margin:8px 0 20px;font-size:16px}
.card{background:var(--card);border:1px solid #ffffff12;border-radius:20px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 6px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid #ffffff18;background:#0e1024;color:var(--ink);outline:none}
input[type=text]:focus{border-color:var(--accent)}
.code-in{text-transform:uppercase;letter-spacing:.35em;text-align:center;font-weight:800}
button{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),#5b8cff);width:100%;transition:transform .08s,opacity .2s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:var(--card2);color:var(--ink)}
button.small{width:auto;font-size:14px;padding:9px 14px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.sp{height:12px}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.35}
.rules b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:14px;color:var(--accent2)}
.codebox{text-align:center}
.code{font-size:56px;font-weight:900;letter-spacing:.18em;margin:2px 0 6px;padding-left:.18em}
.mute{color:var(--mute);font-size:14px}
.players{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--card2);font-weight:600;font-size:15px}
.chip i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;color:#10112a;font-weight:800;font-size:13px}
.chip.off{opacity:.4}
.chip small{color:var(--mute);font-weight:500}
.chip.done{outline:2px solid var(--good)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pill{background:var(--card2);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700}
.big{font-size:22px;font-weight:800;margin:0 0 6px}
.prompt{font-size:20px;line-height:1.35;margin:0 0 14px}
.prompt em{font-style:normal;color:var(--accent2);font-weight:800}
.words{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.w{padding:12px 18px;border-radius:16px;font-size:22px;font-weight:800;color:#10112a;display:flex;flex-direction:column;align-items:center;min-width:90px;animation:pop .5s both cubic-bezier(.2,1.4,.4,1)}
.w small{font-size:11px;font-weight:700;opacity:.7;letter-spacing:.04em}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.hist{display:grid;gap:8px}
.hist div{font-size:14px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hist b{color:var(--ink);background:var(--card2);padding:2px 8px;border-radius:8px}
.win{text-align:center}
.win h2{font-size:34px;margin:6px 0}
.err{background:#4a1d2a;color:#ffc9d2;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:15px}
.wait{display:flex;align-items:center;gap:10px;color:var(--mute);justify-content:center;padding:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:b 1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-6px);opacity:.4}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.conn{position:fixed;left:50%;transform:translateX(-50%);top:8px;background:#3b2a12;color:#ffd48a;padding:6px 14px;border-radius:999px;font-size:13px;z-index:10}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<script>
(() => {
const $app = document.getElementById('app');
const store = {
  get(k){ try { return localStorage.getItem(k) } catch { return null } },
  set(k,v){ try { localStorage.setItem(k,v) } catch {} },
  del(k){ try { localStorage.removeItem(k) } catch {} }
};
let ws, state = null, err = '', connected = false, draft = '', myId = null;
let nameDraft = store.get('mm_name') || '', codeDraft = (location.pathname.replace(/^\/+|\/+$/g, '') || '').toUpperCase().slice(0,4);
if (!/^[A-Z]{4}$/.test(codeDraft)) codeDraft = '';
let lastPhaseKey = '';

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => {
    connected = true;
    const targetCode = (location.pathname.replace(/^\/+|\/+$/g, '') || '').toUpperCase().slice(0, 4);
    const saved = store.get('mm_session');
    if (saved) {
      try {
        const s = JSON.parse(saved);
        if (!targetCode || targetCode === s.code) {
          ws.send(JSON.stringify({ type:'join', code:s.code, token:s.token, name:nameDraft }));
        } else {
          store.del('mm_session');
        }
      } catch {}
    }
    render();
  };
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'joined') { myId = m.id; store.set('mm_session', JSON.stringify({ code:m.code, token:m.token })); history.replaceState(null,'','/'+m.code); }
    else if (m.type === 'state') { err=''; const prev=state; state = m; onState(prev); }
    else if (m.type === 'error') {
      err = m.message;
      // A stale saved token or deleted room must not strand the UI in an old game.
      if (/saved session has expired|No room/i.test(m.message)) {
        store.del('mm_session'); state = null; myId = null; lastPhaseKey = '';
        history.replaceState(null, '', '/');
      } else if (!state) {
        store.del('mm_session');
      }
      render();
    }
  };
  ws.onclose = () => { connected = false; render(); setTimeout(connect, 1200); };
}
const send = (o) => {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    err = 'Connection lost. Reconnecting… Please try again in a moment.';
    render();
    return false;
  }
  ws.send(JSON.stringify(o));
  return true;
};

function onState(prev) {
  const key = state.phase + ':' + state.round;
  if (key !== lastPhaseKey) {
    if (state.phase === 'input') draft = '';
    if (state.phase === 'won') setTimeout(confetti, 300);
    lastPhaseKey = key;
  }
  render();
}

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initial = (n) => esc((n||'?')[0].toUpperCase());
const chip = (p, extra='') => `<div class="chip ${p.connected?'':'off'} ${extra}"><i style="background:${p.color}">${initial(p.name)}</i>${esc(p.name)}${p.id===myId?' <small>(you)</small>':''}${p.id===state?.hostId?' <small>👑</small>':''}</div>`;

function render() {
  const keep = document.activeElement && document.activeElement.id;
  const pos = keep && document.activeElement.selectionStart;
  let h = '';
  if (!connected) h += `<div class="conn">Reconnecting…</div>`;
  if (err) h += `<div class="err">${esc(err)}</div>`;
  h += state ? game() : home();
  $app.innerHTML = h;
  bind();
  if (keep) { const el = document.getElementById(keep); if (el) { el.focus(); try { el.setSelectionRange(pos,pos) } catch {} } }
}

function home() {
  return `
  <h1>Mind <span>Meld</span></h1>
  <p class="tag">A cooperative word game. Think alike to win.</p>
  <div class="card">
    <ul class="rules">
      <li><b>1</b><span>Everyone secretly types <em>any</em> word. Words are revealed together.</span></li>
      <li><b>2</b><span>Next round, each of you types a word that <em>connects</em> the words just revealed.</span></li>
      <li><b>3</b><span>Keep going until <em>everyone types the same word</em>. Fewer rounds = better!</span></li>
    </ul>
  </div>
  <div class="card">
    <label for="name">Your name</label>
    <input type="text" id="name" maxlength="14" placeholder="e.g. Abhi" value="${esc(nameDraft)}" autocomplete="off">
    <div class="sp"></div>
    <button id="create" ${connected?'':'disabled'}>Create a room</button>
  </div>
  <div class="card">
    <label for="code">Or join with a code</label>
    <input type="text" id="code" class="code-in" maxlength="4" placeholder="ABCD" value="${esc(codeDraft)}" autocomplete="off" autocapitalize="characters">
    <div class="sp"></div>
    <button id="join" class="ghost" ${connected?'':'disabled'}>Join room</button>
  </div>
  <p class="mute" style="text-align:center">No login. No install. 2–8 players.</p>`;
}

function topbar() {
  return `<div class="top"><span class="pill">Room ${state.code}</span><span class="pill">${state.round?'Round '+state.round:'Lobby'}${state.best?' · Best: '+state.best:''}</span></div>`;
}

function historyHtml() {
  if (!state.history.length) return '';
  const rows = state.history.slice().reverse().map(r => `<div><span class="mute">R${r.round}</span> ${r.words.map(w=>`<b style="border-left:4px solid ${w.color}">${esc(w.word)}</b>`).join(' ')}</div>`).join('');
  return `<div class="card"><label>History</label><div class="hist">${rows}</div></div>`;
}

function lastWords() {
  const last = state.history[state.history.length-1];
  return last ? last.words : [];
}

function game() {
  const isHost = state.hostId === myId;
  const me = state.players.find(p => p.id === myId);
  const live = state.players.filter(p => p.connected);
  let h = topbar();

  if (state.phase === 'lobby') {
    const link = location.origin + '/' + state.code;
    h += `<div class="card codebox"><label>Share this code</label><div class="code">${state.code}</div>
      <div class="mute" style="word-break:break-all">${esc(link)}</div><div class="sp"></div>
      <button class="ghost" id="copy">Copy invite link</button></div>
      <div class="card"><label>Players (${live.length}/8)</label><div class="players">${state.players.map(p=>chip(p)).join('')}</div></div>
      <div class="card"><label>How to play</label><ul class="rules">
        <li><b>1</b><span>Type any word in secret. All words appear together.</span></li>
        <li><b>2</b><span>Then write a word that <em>connects</em> everyone's last words.</span></li>
        <li><b>3</b><span>Win when <em>everyone types the same word</em>.</span></li></ul></div>
      ${isHost ? `<button id="start" ${live.length<2?'disabled':''}>${live.length<2?'Waiting for a friend…':'Start game'}</button>` : `<div class="wait"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Waiting for the host to start</div>`}
      <div class="sp"></div><button class="ghost small" id="leave">Leave room</button>`;
  }

  else if (state.phase === 'input') {
    const lw = lastWords();
    const submitted = state.myWord !== null;
    h += `<div class="card">`;
    if (state.round === 1) {
      h += `<p class="big">Pick any word</p><p class="prompt">Type the first word that comes to mind. No pressure, no wrong answer.</p>`;
    } else {
      h += `<p class="big">Find the connection</p><p class="prompt">Last round: ${lw.map(w=>`<em>${esc(w.word)}</em>`).join(' · ')}<br>Type a word that links them all.</p>`;
    }
    if (!submitted) {
      h += `<input type="text" id="word" aria-label="Your word" maxlength="24" placeholder="Your word…" value="${esc(draft)}" autocomplete="off" autocapitalize="off"><div class="sp"></div><button id="submit">Lock it in</button>`;
    } else {
      h += `<div class="words"><div class="w" style="background:${me?.color || 'var(--accent)'}"><small>YOUR WORD</small>${esc(state.myWord)}</div></div>`;
    }
    h += `</div><div class="card"><label>${submitted?'Waiting for others':'Players'}</label><div class="players">${state.players.map(p=>chip(p,p.submitted?'done':'')).join('')}</div></div>`;
    h += historyHtml();
  }

  else if (state.phase === 'reveal' || state.phase === 'won') {
    const lw = lastWords();
    const won = state.phase === 'won';
    h += `<div class="card ${won?'win':''}">`;
    if (won) h += `<div style="font-size:54px">🎉</div><h2>Mind meld!</h2><p class="prompt">Everyone said <em>${esc(lw[0].word)}</em><br>in <em>${state.round}</em> round${state.round===1?'':'s'}${state.best===state.round?' · new best!':''}</p>`;
    else h += `<p class="big">Round ${state.round} reveal</p><p class="prompt mute">Not quite. Find the word in the middle!</p>`;
    h += `<div class="words" ${won?'style="justify-content:center"':''}>${lw.map((w,i)=>`<div class="w" style="background:${w.color};animation-delay:${i*120}ms"><small>${esc(w.name.toUpperCase())}</small>${esc(w.word)}</div>`).join('')}</div></div>`;
    if (won) {
      h += isHost ? `<button id="again">Play again</button>` : `<div class="wait"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Waiting for host to restart</div>`;
      h += `<div class="sp"></div><button class="ghost small" id="leave">Leave room</button>`;
    } else {
      h += me && me.ready ? `<div class="wait"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Waiting for ${live.filter(p=>!p.ready).length} more…</div>` : `<button id="next">Ready for next round</button>`;
    }
    h += `<div class="sp"></div>` + historyHtml();
  }
  return h;
}

function bind() {
  const $ = (id) => document.getElementById(id);
  const name = $('name'), code = $('code'), word = $('word');
  if (name) name.oninput = () => { nameDraft = name.value; store.set('mm_name', nameDraft); };
  if (code) code.oninput = () => { code.value = code.value.toUpperCase().replace(/[^A-Z]/g,''); codeDraft = code.value; };
  if (word) { word.oninput = () => { draft = word.value; }; word.onkeydown = (e) => { if (e.key==='Enter') doSubmit(); }; if (document.activeElement !== word) word.focus(); }
  if (code) code.onkeydown = (e) => { if (e.key==='Enter') doJoin(); };
  if (name) name.onkeydown = (e) => { if (e.key==='Enter') (codeDraft.length===4?doJoin:doCreate)(); };
  const on = (id, fn) => { const el=$(id); if (el) el.onclick = fn; };
  on('create', doCreate); on('join', doJoin);
  on('start', () => send({type:'start'}));
  on('submit', doSubmit);
  on('next', () => send({type:'next'}));
  on('again', () => send({type:'again'}));
  on('leave', () => { send({type:'leave'}); store.del('mm_session'); state=null; myId=null; lastPhaseKey=''; history.replaceState(null,'','/'); render(); });
  on('copy', async () => { try { await navigator.clipboard.writeText(location.origin+'/'+state.code); $('copy').textContent='Copied! ✓'; } catch { $('copy').textContent=location.origin+'/'+state.code; } });
}
function doCreate() { err=''; if (!connected) { err='Connecting to the game server…'; render(); return; } send({type:'create', name:nameDraft || 'Player'}); }
function doJoin() { err=''; if (!connected) { err='Connecting to the game server…'; render(); return; } if (codeDraft.length!==4) { err='Enter the 4-letter room code.'; render(); return; } send({type:'join', code:codeDraft, name:nameDraft || 'Player'}); }
function doSubmit() { const v = (draft||'').trim(); if (!v) { err='Type a word first.'; render(); return; } send({type:'submit', word:v}); }

// confetti
function confetti() {
  const c = document.getElementById('fx'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#7c5cff','#22d3ee','#34d399','#ffd43b','#ff6b6b','#f783ac'];
  const ps = Array.from({length:140}, () => ({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t = 0;
  (function f(){ x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();}); if (++t<220) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}

render();
connect();
})();
</script>
</body>
</html>
